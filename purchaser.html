<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая закупка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            padding-bottom: 80px;
        }
        h1 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; color: var(--tg-theme-hint-color, #999999); margin-bottom: 6px; }
        select, input {
            width: 100%; padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
        }
        .ai-button {
            width: 100%; padding: 14px; margin-bottom: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .ai-button:disabled { opacity: 0.6; cursor: not-allowed; }
        .radio-group { display: flex; gap: 8px; margin-bottom: 16px; }
        .radio-btn {
            flex: 1; padding: 12px; border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 8px; background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000); font-size: 14px; cursor: pointer; text-align: center;
        }
        .radio-btn.active {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border-color: var(--tg-theme-button-color, #3390ec);
        }
        .total-block {
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px; padding: 16px; margin-bottom: 16px;
        }
        .total-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .total-row:last-child { margin-bottom: 0; font-weight: 600; font-size: 16px; }
        .main-button {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; padding: 16px; font-size: 16px; font-weight: 600; cursor: pointer;
        }
        .main-button:disabled { opacity: 0.5; cursor: not-allowed; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>🛒 Новая закупка</h1>
    
    <button class="ai-button" id="ai-scan-btn">
        📸 Распознать чек (ИИ)
    </button>
    <input type="file" id="receipt-input" accept="image/*" class="hidden" />

    <div class="form-group">
        <label>Продукт</label>
        <select id="product-select">
            <option value="">— Выберите продукт —</option>
            <option value="1">Мясо (кг)</option>
            <option value="2">Рис (кг)</option>
            <option value="3">Морковь (кг)</option>
            <option value="4">Лук (кг)</option>
            <option value="5">Масло (л)</option>
            <option value="6">Специи (кг)</option>
            <option value="7">Упаковка (шт)</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>Количество</label>
        <input type="number" id="quantity" min="0.1" step="0.1" placeholder="Например: 10" />
    </div>
    
    <div class="form-group">
        <label>Цена за единицу (сум)</label>
        <input type="number" id="price" min="0" placeholder="Например: 90000" />
    </div>
    
    <div class="form-group">
        <label>Способ оплаты</label>
        <div class="radio-group">
            <div class="radio-btn active" data-method="card">💳 Карта</div>
            <div class="radio-btn" data-method="cash">💵 Наличные</div>
        </div>
    </div>
    
    <div class="total-block">
        <div class="total-row">
            <span>Сумма закупки</span>
            <span id="total-amount">0 сум</span>
        </div>
    </div>
    
    <button class="main-button" id="confirm-btn" disabled>
        ✅ Подтвердить закупку
    </button>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const API_URL = 'https://kitchen-bot-55-a.replit.app';
        
        const stock = {
            1: { name: 'Мясо', unit: 'кг' }, 2: { name: 'Рис', unit: 'кг' },
            3: { name: 'Морковь', unit: 'кг' }, 4: { name: 'Лук', unit: 'кг' },
            5: { name: 'Масло', unit: 'л' }, 6: { name: 'Специи', unit: 'кг' },
            7: { name: 'Упаковка', unit: 'шт' }
        };
        
        let selectedProduct = null;
        let paymentMethod = 'card';
        
        document.getElementById('ai-scan-btn').addEventListener('click', () => {
            document.getElementById('receipt-input').click();
        });
        
        document.getElementById('receipt-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const btn = document.getElementById('ai-scan-btn');
            btn.disabled = true;
            btn.textContent = '⏳ ИИ анализирует чек...';
            tg.showProgress();
            
            const reader = new FileReader();
            reader.onload = async (event) => {
                const base64Image = event.target.result.split(',')[1];
                
                try {
                    const response = await fetch(`${API_URL}/api/parse-receipt`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image_base64: base64Image })
                    });
                    const data = await response.json();
                    
                    if (data.error) {
                        tg.showPopup({ title: 'Ошибка', message: data.error });
                    } else if (data.items && data.items.length > 0) {
                        const item = data.items[0];
                        let productId = "";
                        for (const [id, info] of Object.entries(stock)) {
                            if (item.name.toLowerCase().includes(info.name.toLowerCase())) {
                                productId = id;
                                break;
                            }
                        }
                        
                        if (productId) {
                            document.getElementById('product-select').value = productId;
                            document.getElementById('product-select').dispatchEvent(new Event('change'));
                        }
                        document.getElementById('quantity').value = item.quantity;
                        const unitPrice = Math.round(item.total_price / item.quantity);
                        document.getElementById('price').value = unitPrice;
                        
                        updateDisplay();
                        tg.showPopup({ title: 'Успех!', message: `Распознано: ${item.name}, ${item.quantity} ${item.unit}` });
                    } else {
                        tg.showPopup({ title: 'Не найдено', message: 'ИИ не смог найти товары. Попробуйте вручную.' });
                    }
                } catch (err) {
                    console.error(err);
                    tg.showPopup({ title: 'Ошибка сети', message: 'Не удалось связаться с сервером.' });
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '📸 Распознать чек (ИИ)';
                    tg.hideProgress();
                }
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('product-select').addEventListener('change', (e) => {
            selectedProduct = stock[e.target.value] || null;
            updateDisplay();
        });
        document.getElementById('quantity').addEventListener('input', updateDisplay);
        document.getElementById('price').addEventListener('input', updateDisplay);
        
        document.querySelectorAll('.radio-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                paymentMethod = btn.dataset.method;
            });
        });
        
        function updateDisplay() {
            const quantity = parseFloat(document.getElementById('quantity').value) || 0;
            const price = parseFloat(document.getElementById('price').value) || 0;
            document.getElementById('total-amount').textContent = Math.round(quantity * price).toLocaleString('ru-RU') + ' сум';
            document.getElementById('confirm-btn').disabled = !(selectedProduct && quantity > 0 && price > 0);
        }
        
        document.getElementById('confirm-btn').addEventListener('click', () => {
            const quantity = parseFloat(document.getElementById('quantity').value);
            const price = parseFloat(document.getElementById('price').value);
            const data = {
                action: 'add_purchase',
                productId: parseInt(document.getElementById('product-select').value),
                productName: selectedProduct.name,
                unit: selectedProduct.unit,
                quantity: quantity,
                pricePerUnit: price,
                totalAmount: quantity * price,
                paymentMethod: paymentMethod
            };
            tg.sendData(JSON.stringify(data));
            tg.showPopup({ title: '✅ Закупка добавлена', message: `Остаток ${selectedProduct.name} увеличен`, buttons: [{ type: 'ok' }] });
        });
    </script>
</body>
</html>
