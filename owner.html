<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Владелец</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
        }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 20px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab {
            flex: 1; padding: 12px; border: none; border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px; font-weight: 500; cursor: pointer;
        }
        .tab.active {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .content { display: none; }
        .content.active { display: block; }
        .stats-card {
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px; padding: 16px; margin-bottom: 12px;
        }
        .stat-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px solid var(--tg-theme-hint-color, #e0e0e0);
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { font-size: 14px; color: var(--tg-theme-hint-color, #666666); }
        .stat-value { font-size: 16px; font-weight: 600; }
        .stat-value.positive { color: #4caf50; }
        .stat-value.negative { color: #f44336; }
        .stat-detail { font-size: 12px; color: var(--tg-theme-hint-color, #999999); margin-top: 4px; }
        .client-card {
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer;
        }
        .client-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        .client-name { font-size: 16px; font-weight: 600; }
        .client-debt { font-size: 16px; font-weight: 600; }
        .client-debt.zero { color: #4caf50; }
        .client-debt.has-debt { color: #f44336; }
        .client-stats {
            display: flex; gap: 16px; font-size: 13px;
            color: var(--tg-theme-hint-color, #666666);
        }
        .loading { text-align: center; padding: 20px; color: var(--tg-theme-hint-color, #999999); }
    </style>
</head>
<body>
    <h1>👔 Панель управления</h1>
    
    <div class="tabs">
        <button class="tab active" data-tab="results">💰 Итоги</button>
        <button class="tab" data-tab="clients">🤝 Клиенты</button>
    </div>
    
    <div id="results" class="content active">
        <div id="stats-loading" class="loading">Загрузка данных...</div>
        <div id="stats-content" style="display: none;">
            <div class="stats-card">
                <div class="stat-row">
                    <span class="stat-label">Выручка</span>
                    <span class="stat-value" id="revenue">0 сум</span>
                </div>
                <div class="stat-detail" id="revenue-detail">—</div>
                <div class="stat-row">
                    <span class="stat-label">Себестоимость</span>
                    <span class="stat-value" id="cost">0 сум</span>
                </div>
                <div class="stat-detail" id="cost-detail">—</div>
                <div class="stat-row">
                    <span class="stat-label">Прибыль</span>
                    <span class="stat-value" id="profit">0 сум</span>
                </div>
                <div class="stat-detail" id="profit-detail">—</div>
            </div>
            
            <div class="stats-card">
                <div class="stat-row">
                    <span class="stat-label">Долг клиентов</span>
                    <span class="stat-value negative" id="client-debt">0 сум</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Остаток продуктов</span>
                    <span class="stat-value" id="stock-value">0 сум</span>
                </div>
            </div>
        </div>
    </div>
    
    <div id="clients" class="content">
        <div id="clients-loading" class="loading">Загрузка клиентов...</div>
        <div id="clients-content"></div>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // ВАЖНО: Замени на свой адрес API из Replit
        const API_URL = 'https://658059b9-1fae-4122-ab09-24f656a9aff1-00-yflos2wz3xgw.sisko.replit.dev';
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });
        
        // Загрузка статистики
        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/api/stats`);
                const data = await response.json();
                
                document.getElementById('revenue').textContent = formatMoney(data.revenue || 0) + ' сум';
                document.getElementById('cost').textContent = formatMoney(data.cost || 0) + ' сум';
                
                const profit = (data.revenue || 0) - (data.cost || 0);
                const profitEl = document.getElementById('profit');
                profitEl.textContent = formatMoney(profit) + ' сум';
                profitEl.className = 'stat-value ' + (profit >= 0 ? 'positive' : 'negative');
                
                document.getElementById('client-debt').textContent = formatMoney(data.clientDebt || 0) + ' сум';
                document.getElementById('stock-value').textContent = formatMoney(data.stockValue || 0) + ' сум';
                
                document.getElementById('stats-loading').style.display = 'none';
                document.getElementById('stats-content').style.display = 'block';
            } catch (error) {
                document.getElementById('stats-loading').textContent = 'Ошибка загрузки данных';
                console.error('Error loading stats:', error);
            }
        }
        
        function formatMoney(amount) {
            return Math.round(amount).toLocaleString('ru-RU');
        }
        
        loadStats();
    </script>
</body>
</html>
